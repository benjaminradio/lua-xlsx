name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Lua ${{ matrix.lua }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lua: "5.4", feature: lua54, pkg: lua5.4 }
          - { lua: "5.3", feature: lua53, pkg: lua5.3 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Build
        run: cargo build --release --no-default-features --features ${{ matrix.feature }}
      - name: Test
        run: ${{ matrix.pkg }} tests/test.lua "./target/release/lib?.so"

  clippy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -- -D warnings

  windows-check:
    name: Build (Windows, Lua 5.4)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
